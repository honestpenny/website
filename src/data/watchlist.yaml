# Official sources the newsroom checks for announcements that change our facts or guides.
# Add a source when a new guide depends on it. Official domains only; news articles are leads, never sources.
# `affects`: fact ids or guide slugs to re-check when this source changes.

- name: CRA newsroom
  url: https://www.canada.ca/en/revenue-agency/news.html
  watch: [tax brackets, indexation, TFSA limit, RRSP limit, benefit amounts, payment dates, filing deadlines]
  affects: [tfsa-limit-2026, rrsp-limit-2026, honest-penny-steps]
- name: CRA - TFSA/RRSP/MP limits table
  url: https://www.canada.ca/en/revenue-agency/services/tax/registered-plans-administrators/pspa/mp-rrsp-dpsp-tfsa-limits-ympe.html
  watch: [new year's limits]
  affects: [tfsa-limit-2026, rrsp-limit-2026]
- name: CRA - Tax rates and income brackets for individuals
  url: https://www.canada.ca/en/revenue-agency/services/tax/individuals/frequently-asked-questions-individuals/canadian-income-tax-rates-individuals-current-previous-years.html
  watch: [federal and provincial brackets]
  affects: []
- name: Department of Finance Canada news
  url: https://www.canada.ca/en/department-finance/news.html
  watch: [budget measures, new or changed benefits, mortgage rules]
  affects: [honest-penny-steps]
- name: Government of Alberta news
  url: https://www.alberta.ca/news
