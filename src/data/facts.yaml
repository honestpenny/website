# Honest Penny fact registry — ONE place for every number a guide relies on.
# Guides show these with <Fact id="..." />. Change a value here and every page updates.
# Rules: official source only; `checked` = date a person/agent last confirmed it at `source.url`;
# `reviewBy` = when it must be re-checked (tests fail after this date). `effective` = when the value applies.
# The newsroom skill (.claude/skills/newsroom) proposes edits to this file via pull request.

